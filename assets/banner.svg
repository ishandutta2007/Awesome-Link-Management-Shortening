<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#111827"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/></linearGradient><filter id="blur-bg" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="70"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1" fill="rgba(255, 255, 255, 0.1)"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.5}50%{transform:scale(1.15) translate(20px,-20px);opacity:.8}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.2) translate(-25px,20px);opacity:.7}}@keyframes dashMove{0%{stroke-dashoffset:240}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.orb-1{animation:pulseOrb 10s ease-in-out infinite;transform-origin:220px 120px}.orb-2{animation:pulseOrb2 12s ease-in-out infinite;transform-origin:980px 280px}.flow-line{stroke-dasharray:8 12;animation:dashMove 12s linear infinite}.float-1{animation:floatCard1 5s ease-in-out infinite}.float-2{animation:floatCard2 6s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.subtitle-text{font-weight:500}.mono-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g filter="url(#blur-bg)"><circle cx="220" cy="120" r="160" fill="url(#cyan-glow)" class="orb-1"/><circle cx="980" cy="280" r="180" fill="url(#purple-glow)" class="orb-2"/></g><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 100 80 Q 300 30 600 70 T 1100 60" class="flow-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 80 340 Q 400 390 700 330 T 1120 350" class="flow-line"/><path fill="none" stroke="#6366f1" stroke-opacity=".6" stroke-width="1" d="M 150 200 C 400 120 800 280 1050 200" class="flow-line"/></g><g class="float-1" transform="translate(80, 50)"><rect width="180" height="36" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#10b981" filter="url(#glow)"/><text x="34" y="22" fill="#94a3b8" class="mono-text" font-size="12">⚡ 0.8ms Redirects</text></g><g class="float-2" transform="translate(940, 50)"><rect width="180" height="36" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#818cf8" filter="url(#glow)"/><text x="34" y="22" fill="#cbd5e1" class="mono-text" font-size="12">📊 Click Analytics</text></g><g class="float-2" transform="translate(80, 335)"><rect width="195" height="36" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" rx="18"/><text x="20" y="22" fill="#38bdf8" class="mono-text" font-size="12">🔗 Branded Domains</text></g><g class="float-1" transform="translate(930, 335)"><rect width="190" height="36" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="18"/><text x="20" y="22" fill="#c084fc" class="mono-text" font-size="12">🛡️ Self-Hosted Stack</text></g><g transform="translate(485, 95)"><rect width="230" height="28" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" rx="14"/><text x="115" y="18" fill="#38bdf8" class="mono-text" font-size="11" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM 2026</text></g><text x="600" y="170" fill="#fff" class="title-text" filter="url(#glow)" font-size="40" letter-spacing="-.5" text-anchor="middle">Awesome Link Management &amp; Shortening</text><text x="600" y="215" fill="url(#accent-grad)" class="title-text" font-size="22" font-weight="600" letter-spacing=".2" text-anchor="middle">Enterprise SaaS Platforms &amp; Modern Open-Source Infrastructure</text><text x="600" y="260" fill="#94a3b8" class="subtitle-text" font-size="15" text-anchor="middle">Branded URLs • Real-Time Click Attribution • Sub-Millisecond Redirects • QR Engines • Edge Deployment</text><rect width="300" height="2" x="450" y="285" fill="url(#accent-grad)" opacity=".7" rx="1"/></svg>