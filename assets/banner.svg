<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Ambient Glow -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1" fill="rgba(255, 255, 255, 0.1)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.15) translate(20px, -20px); opacity: 0.8; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.7; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 220px 120px; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: 980px 280px; }
    .flow-line { stroke-dasharray: 8 12; animation: dashMove 12s linear infinite; }
    .float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Animated Glow Orbs -->
  <g filter="url(#blur-bg)">
    <circle class="orb-1" cx="220" cy="120" r="160" fill="url(#cyan-glow)" />
    <circle class="orb-2" cx="980" cy="280" r="180" fill="url(#purple-glow)" />
  </g>

  <!-- Network / Routing Data Flows (Behind Foreground Text) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 100 80 Q 300 30 600 70 T 1100 60" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 80 340 Q 400 390 700 330 T 1120 350" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path class="flow-line" d="M 150 200 C 400 120 800 280 1050 200" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Ambient Decorative Badges / Floating Elements (Framing the Canvas) -->
  <!-- Top Left Pill: Dynamic Analytics Node -->
  <g class="float-1" transform="translate(80, 50)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="34" y="22" fill="#94a3b8" font-size="12" class="mono-text">⚡ 0.8ms Redirects</text>
  </g>

  <!-- Top Right Pill: Scale Indicator -->
  <g class="float-2" transform="translate(940, 50)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#818cf8" filter="url(#glow)" />
    <text x="34" y="22" fill="#cbd5e1" font-size="12" class="mono-text">📊 Click Analytics</text>
  </g>

  <!-- Bottom Left Pill: Custom Domains -->
  <g class="float-2" transform="translate(80, 335)">
    <rect width="195" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" />
    <text x="20" y="22" fill="#38bdf8" font-size="12" class="mono-text">🔗 Branded Domains</text>
  </g>

  <!-- Bottom Right Pill: Open Source / Self-Hosted -->
  <g class="float-1" transform="translate(930, 335)">
    <rect width="190" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <text x="20" y="22" fill="#c084fc" font-size="12" class="mono-text">🛡️ Self-Hosted Stack</text>
  </g>

  <!-- FOREGROUND: Clear, Crisp Title & Subtitle Hierarchy -->
  <!-- Top Category Chip -->
  <g transform="translate(485, 95)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="115" y="18" fill="#38bdf8" font-size="11" class="mono-text" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="170" text-anchor="middle" fill="#ffffff" font-size="40" class="title-text" filter="url(#glow)" letter-spacing="-0.5">
    Awesome Link Management &amp; Shortening
  </text>

  <!-- Secondary Title / Gradient Hook -->
  <text x="600" y="215" text-anchor="middle" fill="url(#accent-grad)" font-size="22" class="title-text" font-weight="600" letter-spacing="0.2">
    Enterprise SaaS Platforms &amp; Modern Open-Source Infrastructure
  </text>

  <!-- Subtitle / Meta Tagline -->
  <text x="600" y="260" text-anchor="middle" fill="#94a3b8" font-size="15" class="subtitle-text">
    Branded URLs • Real-Time Click Attribution • Sub-Millisecond Redirects • QR Engines • Edge Deployment
  </text>

  <!-- Bottom Visual Accent Divider Line -->
  <rect x="450" y="285" width="300" height="2" rx="1" fill="url(#accent-grad)" opacity="0.7" />
</svg>
